<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure login form demonstration" />
    <title>Juice Shop Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="bg-gray-100 text-gray-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <section
        class="w-full max-w-md rounded-lg bg-white p-8 shadow-md"
        aria-labelledby="login-title"
      >
        <h1 id="login-title" class="text-2xl font-bold">Juice Shop Login</h1>
        <p class="mt-2 text-sm text-gray-600">
          Enter your email and password to sign in.
        </p>

        <form id="login-form" class="mt-6" novalidate>
          <div class="mb-4">
            <label for="email" class="mb-1 block text-sm font-medium">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              class="w-full rounded border border-gray-300 px-3 py-2 focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-200"
              autocomplete="username"
              maxlength="254"
              placeholder="student@example.com"
              required
            />
            <p class="mt-1 min-h-5 text-sm text-red-600" id="email-error" aria-live="polite"></p>
          </div>

          <div class="mb-5">
            <label for="password" class="mb-1 block text-sm font-medium">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="w-full rounded border border-gray-300 px-3 py-2 focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-200"
              autocomplete="current-password"
              maxlength="128"
              placeholder="At least 8 characters"
              required
            />
            <p class="mt-1 min-h-5 text-sm text-red-600" id="password-error" aria-live="polite"></p>
          </div>

          <button
            id="submit-button"
            class="w-full rounded bg-green-600 px-4 py-2 font-medium text-white hover:bg-green-700 disabled:cursor-wait disabled:opacity-60"
            type="submit"
          >
            Sign in
          </button>
          <p id="status" class="mt-4 min-h-6 text-center text-sm font-medium" role="status" aria-live="polite"></p>
        </form>

        <aside class="mt-5 rounded bg-gray-50 p-3 text-sm text-gray-600">
          <p class="font-medium text-gray-800">Demo account</p>
          <p>student@example.com / SecurePass123!</p>
        </aside>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
